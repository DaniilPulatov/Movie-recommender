version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: postgres-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movie_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:   